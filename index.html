<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჯარის განრიგი</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="m.jpg">
    <link rel="apple-touch-icon" href="1.jpg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ჯარის განრიგი">
    <meta name="theme-color" content="#0d1117">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d1117;
            --panel: #161d2b;
            --panel-border: #2a3448;
            --olive: #7a8a5a;
            --gold: #cda85e;
            --duty: #4c7a52;
            --duty-dim: #2e4a33;
            --free: #b08a57;
            --free-dim: #5c4a34;
            --text: #eef0e8;
            --text-dim: #8791a3;
            --text-faint: #56617a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(122,138,90,0.14), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(205,168,94,0.08), transparent 45%),
                var(--bg);
            min-height: 100vh;
            padding: 18px 14px 40px;
            color: var(--text);
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        header.app-header {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        header.app-header .bar {
            width: 22px;
            height: 2px;
            background: var(--olive);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text);
            text-align: center;
        }

        /* Status banner */
        .message-container {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-left: 3px solid var(--gold);
            border-radius: 4px;
            padding: 16px 18px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 1.02rem;
            letter-spacing: 0.01em;
            min-height: 20px;
        }

        .message-container:empty {
            display: none;
        }

        /* Remaining duty days — hero counter */
        .remaining-card {
            background: linear-gradient(135deg, rgba(76,122,82,0.18), rgba(22,29,43,0.4)), var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 18px 18px 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .remaining-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 4px;
        }

        .remaining-number {
            font-family: 'Oswald', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--duty);
            line-height: 1;
        }

        .remaining-number span {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-left: 6px;
        }

        .remaining-sub {
            margin-top: 4px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        /* Today status + countdown */
        .today-status {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .today-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 2px;
        }

        .today-state {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .today-state.state-duty { color: var(--duty); }
        .today-state.state-free { color: var(--free); }

        .countdown-chip {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dim);
            border: 1px dashed var(--panel-border);
            border-radius: 20px;
            padding: 6px 14px;
            white-space: nowrap;
        }

        /* Monthly stats */
        .stats-bar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .stat-chip {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
        }

        .stat-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .dot-duty { background: var(--duty); }
        .dot-free { background: var(--free); }

        .stat-chip strong {
            color: var(--text);
        }

        /* Navigation */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }

        .nav-button {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--panel-border);
            padding: 9px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }

        .nav-button:hover {
            border-color: var(--olive);
            color: var(--text);
            background: rgba(122,138,90,0.08);
        }

        .nav-button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .nav-button:active {
            transform: scale(0.97);
        }

        .nav-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .nav-button:disabled:hover {
            border-color: var(--panel-border);
            background: transparent;
            color: var(--text-dim);
        }

        #current-month {
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text);
            text-transform: uppercase;
            text-align: center;
            flex: 1;
        }

        /* Calendar */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 6px;
        }

        .weekday-header {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            text-align: center;
            padding: 4px 2px 10px;
            color: var(--text-faint);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--panel-border);
        }

        .date-cell {
            position: relative;
            padding: 10px 4px 8px;
            text-align: center;
            border-radius: 4px;
            min-height: 62px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid transparent;
            transition: transform 0.12s ease;
        }

        .date-cell:active {
            transform: scale(0.95);
        }

        /* corner duty tab — signature element */
        .date-cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8px;
            width: 10px;
            height: 5px;
            border-radius: 0 0 2px 2px;
        }

        .date-cell .day-number {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1px;
            line-height: 1.1;
        }

        .date-cell .weekday {
            font-size: 0.68rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .green {
            background: var(--duty);
            color: #f2f7ee;
        }
        .green::before { background: #dff0d8; }

        .white {
            background: var(--free);
            color: #fbf5eb;
        }
        .white::before { background: #f4e4c8; }

        .past-green {
            background: var(--duty-dim);
            color: var(--text-dim);
        }
        .past-green::before { background: rgba(223,240,216,0.35); }

        .past-white {
            background: var(--free-dim);
            color: var(--text-dim);
        }
        .past-white::before { background: rgba(244,228,200,0.35); }

        .out-of-service {
            background: repeating-linear-gradient(
                135deg,
                rgba(255,255,255,0.025),
                rgba(255,255,255,0.025) 6px,
                transparent 6px,
                transparent 12px
            ), var(--panel);
            color: var(--text-faint);
            border: 1px solid var(--panel-border);
        }
        .out-of-service::before {
            display: none;
        }

        .date-cell.today {
            outline: 2px dashed var(--gold);
            outline-offset: 2px;
        }

        .date-cell.today .day-number::after {
            content: '';
        }

        /* Discharge celebration screen */
        .discharge-screen {
            position: relative;
            min-height: 65vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            padding: 40px 24px;
        }

        .discharge-icon {
            font-size: 2.4rem;
            z-index: 2;
            margin-bottom: 10px;
        }

        .discharge-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.02em;
            z-index: 2;
            margin-bottom: 8px;
        }

        .discharge-sub {
            font-size: 0.9rem;
            color: var(--text-dim);
            z-index: 2;
        }

        .fireworks-layer, .balloons-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: burst 2.6s ease-out infinite;
        }

        .fw1 { top: 22%; left: 20%; background: radial-gradient(circle, var(--gold), transparent 70%); animation-delay: 0s; }
        .fw2 { top: 30%; left: 75%; background: radial-gradient(circle, var(--duty), transparent 70%); animation-delay: 0.7s; }
        .fw3 { top: 55%; left: 12%; background: radial-gradient(circle, var(--free), transparent 70%); animation-delay: 1.4s; }
        .fw4 { top: 18%; left: 52%; background: radial-gradient(circle, var(--olive), transparent 70%); animation-delay: 0.35s; }
        .fw5 { top: 62%; left: 82%; background: radial-gradient(circle, var(--gold), transparent 70%); animation-delay: 1.9s; }

        @keyframes burst {
            0% { transform: scale(0); opacity: 0; }
            15% { opacity: 1; }
            60% { transform: scale(6); opacity: 0.5; }
            100% { transform: scale(9); opacity: 0; }
        }

        .balloon {
            position: absolute;
            bottom: -80px;
            width: 30px;
            height: 38px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: rise 7s linear infinite;
            opacity: 0.85;
        }

        .balloon::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            width: 1px;
            height: 22px;
            background: rgba(238,240,232,0.25);
        }

        .b1 { left: 10%; background: var(--gold); animation-delay: 0s; }
        .b2 { left: 28%; background: var(--duty); animation-delay: 1.2s; }
        .b3 { left: 46%; background: var(--free); animation-delay: 2.4s; }
        .b4 { left: 64%; background: var(--olive); animation-delay: 0.6s; }
        .b5 { left: 80%; background: var(--gold); animation-delay: 3.1s; }
        .b6 { left: 92%; background: var(--duty); animation-delay: 1.8s; }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.85; }
            100% { transform: translateY(-560px) translateX(24px); opacity: 0; }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .calendar {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px;
            }
            .date-cell {
                min-height: 74px;
                padding: 12px 6px 10px;
            }
            .date-cell .day-number {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 400px) {
            .calendar {
                grid-template-columns: 1fr;
            }
            .weekday-header {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <span class="bar"></span>
            <h1>ჯარის განრიგი</h1>
            <span class="bar"></span>
        </header>

        <div id="app-content">
            <div class="remaining-card" id="remaining-card"></div>
            <div class="today-status" id="today-status"></div>
            <div class="message-container" id="message"></div>
            <div class="navigation">
                <button class="nav-button" id="prev-btn" onclick="prevMonth()">← წინა</button>
                <span id="current-month"></span>
                <button class="nav-button" id="next-btn" onclick="nextMonth()">შემდეგი →</button>
            </div>
            <div class="calendar" id="calendar"></div>
            <div class="stats-bar" id="stats"></div>
        </div>

        <div class="discharge-screen" id="discharge-screen">
            <div class="fireworks-layer" aria-hidden="true">
                <span class="firework fw1"></span>
                <span class="firework fw2"></span>
                <span class="firework fw3"></span>
                <span class="firework fw4"></span>
                <span class="firework fw5"></span>
            </div>
            <div class="balloons-layer" aria-hidden="true">
                <span class="balloon b1"></span>
                <span class="balloon b2"></span>
                <span class="balloon b3"></span>
                <span class="balloon b4"></span>
                <span class="balloon b5"></span>
                <span class="balloon b6"></span>
            </div>
            <div class="discharge-icon">🎖️</div>
            <div class="discharge-title">თქვენ დასრულეთ სამხედრო სამსახური</div>
            <div class="discharge-sub">გილოცავთ! 🎉</div>
        </div>
    </div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }

    const months = ["იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი", "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"];
    const weekdays = ["კვი", "ორშ", "სამ", "ოთხ", "ხუთ", "პარ", "შაბ"];

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    const startDate = new Date("2026-07-24");
    const endDate = new Date("2027-01-04");
    const minYear = startDate.getFullYear();
    const minMonth = startDate.getMonth();
    const maxYear = endDate.getFullYear();
    const maxMonth = endDate.getMonth();

    if (currentYear < minYear || (currentYear === minYear && currentMonth < minMonth)) {
        currentYear = minYear;
        currentMonth = minMonth;
    } else if (currentYear > maxYear || (currentYear === maxYear && currentMonth > maxMonth)) {
        currentYear = maxYear;
        currentMonth = maxMonth;
    }

    function cycleDayOf(date) {
        const timeDiff = date - startDate;
        const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
        return ((days % 3) + 3) % 3;
    }

    function countDutyDaysBetween(from, to) {
        let count = 0;
        let d = new Date(from);
        while (d <= to) {
            if (cycleDayOf(d) === 0) count++;
            d.setDate(d.getDate() + 1);
        }
        return count;
    }

    function renderRemaining(startOfToday) {
        const remainingContainer = document.getElementById("remaining-card");
        const remaining = countDutyDaysBetween(startOfToday, endDate);
        remainingContainer.innerHTML = `
            <div class="remaining-label">დარჩენილი განაწესის დღეები</div>
            <div class="remaining-number">${remaining}<span>4 იანვრამდე</span></div>
        `;
    }

    function renderTodayStatus(startOfToday) {
        const statusContainer = document.getElementById("today-status");

        if (startOfToday < startDate) {
            statusContainer.innerHTML = `
                <div>
                    <div class="today-label">დღეს</div>
                    <div class="today-state">სამსახური ჯერ არ დაწყებულა</div>
                </div>
            `;
            return;
        }

        if (startOfToday > endDate) {
            statusContainer.innerHTML = `
                <div>
                    <div class="today-label">დღეს</div>
                    <div class="today-state state-free">სამსახური დასრულებულია 🎉</div>
                </div>
            `;
            return;
        }

        const todayCycle = cycleDayOf(startOfToday);
        const isDuty = todayCycle === 0;

        let daysUntilChange = 0;
        let probe = new Date(startOfToday);
        while (true) {
            probe.setDate(probe.getDate() + 1);
            daysUntilChange++;
            const probeIsDuty = cycleDayOf(probe) === 0;
            if (probeIsDuty !== isDuty) break;
        }

        const chipText = daysUntilChange === 1
            ? "ხვალ იცვლება"
            : `იცვლება ${daysUntilChange} დღეში`;

        statusContainer.innerHTML = `
            <div>
                <div class="today-label">დღეს</div>
                <div class="today-state ${isDuty ? 'state-duty' : 'state-free'}">${isDuty ? 'სამსახურში ხარ' : 'თავისუფალი ხარ'}</div>
            </div>
            <div class="countdown-chip">${chipText}</div>
        `;
    }

    function renderStats(dutyCount, freeCount) {
        const statsContainer = document.getElementById("stats");
        statsContainer.innerHTML = `
            <div class="stat-chip"><span class="dot dot-duty"></span>სამსახური: <strong>${dutyCount}</strong></div>
            <div class="stat-chip"><span class="dot dot-free"></span>თავისუფალი: <strong>${freeCount}</strong></div>
        `;
    }

    function checkDischarge(startOfToday) {
        const appContent = document.getElementById("app-content");
        const dischargeScreen = document.getElementById("discharge-screen");

        if (startOfToday > endDate) {
            appContent.style.display = "none";
            dischargeScreen.style.display = "flex";
            return true;
        }

        appContent.style.display = "";
        dischargeScreen.style.display = "none";
        return false;
    }

    function generateCalendar() {
        const calendarContainer = document.getElementById("calendar");
        const messageContainer = document.getElementById("message");
        const currentMonthDisplay = document.getElementById("current-month");

        const today = new Date();
        const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        if (checkDischarge(startOfToday)) {
            return;
        }

        calendarContainer.innerHTML = '';

        if (window.innerWidth > 400) {
            weekdays.forEach(day => {
                const header = document.createElement("div");
                header.classList.add("weekday-header");
                header.innerText = day;
                calendarContainer.appendChild(header);
            });
        }

        const monthStart = new Date(currentYear, currentMonth, 1);
        const monthEnd = new Date(currentYear, currentMonth + 1, 0);
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        renderRemaining(startOfToday);
        renderTodayStatus(startOfToday);
        let dutyCount = 0;
        let freeCount = 0;

        currentMonthDisplay.innerText = `${months[currentMonth]} ${currentYear}`;

        // Empty cells
        for (let i = 0; i < monthStart.getDay(); i++) {
            calendarContainer.appendChild(document.createElement("div"));
        }

        let currentDate = new Date(monthStart);
        while (currentDate <= monthEnd) {
            const dateCell = document.createElement("div");
            dateCell.classList.add("date-cell");

            const inService = currentDate >= startDate && currentDate <= endDate;
            let cycleDay = null;

            if (inService) {
                cycleDay = cycleDayOf(currentDate);
                if (cycleDay === 0) {
                    dateCell.classList.add("green");
                    dutyCount++;
                } else {
                    dateCell.classList.add("white");
                    freeCount++;
                }
            } else {
                dateCell.classList.add("out-of-service");
            }

            const dayNum = currentDate.getDate();
            const weekday = weekdays[currentDate.getDay()];

            dateCell.innerHTML = `
                <div class="day-number">${dayNum}</div>
                <div class="weekday">${weekday}</div>
            `;

            // Past days styling (fixed: compare against start of today, not the current moment)
            if (inService && currentDate < startOfToday) {
                if (dateCell.classList.contains("green")) {
                    dateCell.classList.remove("green");
                    dateCell.classList.add("past-green");
                } else {
                    dateCell.classList.remove("white");
                    dateCell.classList.add("past-white");
                }
            }

            // Mark today
            if (currentDate.getTime() === startOfToday.getTime()) {
                dateCell.classList.add("today");
            }

            // Tomorrow message
            if (currentDate.getFullYear() === tomorrow.getFullYear() &&
                currentDate.getMonth() === tomorrow.getMonth() &&
                currentDate.getDate() === tomorrow.getDate()) {

                const tomorrowInService = tomorrow >= startDate && tomorrow <= endDate;
                if (tomorrowInService) {
                    messageContainer.innerHTML = cycleDay === 0
                        ? "ხვალ სამხედრო სამსახურში ხარ 😱"
                        : "ხვალ სამოქალაქოზე ხარ😍🥳";
                } else if (tomorrow > endDate) {
                    messageContainer.innerHTML = "ხვალ სამსახური დასრულებულია 🎉";
                } else {
                    messageContainer.innerHTML = "";
                }
            }

            calendarContainer.appendChild(dateCell);
            currentDate.setDate(currentDate.getDate() + 1);
        }

        renderStats(dutyCount, freeCount);

        document.getElementById("prev-btn").disabled = (currentYear === minYear && currentMonth === minMonth);
        document.getElementById("next-btn").disabled = (currentYear === maxYear && currentMonth === maxMonth);
    }

    function prevMonth() {
        if (currentYear === minYear && currentMonth === minMonth) return;
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        generateCalendar();
    }

    function nextMonth() {
        if (currentYear === maxYear && currentMonth === maxMonth) return;
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        generateCalendar();
    }

    generateCalendar();
    window.addEventListener('resize', generateCalendar);
</script>
</body>
</html>
