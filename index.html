<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჯარის განრიგი</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ჯარის განრიგი">
    <meta name="theme-color" content="#0d1117">
 <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d1117;
            --panel: #161d2b;
            --panel-border: #2a3448;
            --olive: #7a8a5a;
            --gold: #cda85e;
            --duty: #4c7a52;
            --duty-dim: #2e4a33;
            --free: #b08a57;
            --free-dim: #5c4a34;
            --text: #eef0e8;
            --text-dim: #8791a3;
            --text-faint: #56617a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(122,138,90,0.14), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(205,168,94,0.08), transparent 45%),
                var(--bg);
            min-height: 100vh;
            padding: 18px 14px 40px;
            color: var(--text);
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        header.app-header {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        header.app-header .bar {
            width: 22px;
            height: 2px;
            background: var(--olive);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text);
            text-align: center;
        }

        /* Status banner */
        .message-container {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-left: 3px solid var(--gold);
            border-radius: 4px;
            padding: 16px 18px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 1.02rem;
            letter-spacing: 0.01em;
            min-height: 20px;
        }

        .message-container:empty {
            display: none;
        }

        /* Remaining duty days — hero counter */
        .remaining-card {
            background: linear-gradient(135deg, rgba(76,122,82,0.18), rgba(22,29,43,0.4)), var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 18px 18px 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .remaining-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 4px;
        }

        .remaining-number {
            font-family: 'Oswald', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--duty);
            line-height: 1;
        }

        .remaining-number span {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-left: 6px;
        }

        .remaining-sub {
            margin-top: 4px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .progress-track {
            margin-top: 12px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--olive), var(--duty));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .progress-label {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .remaining-progress-track {
            margin-top: 12px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
        }

        .remaining-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--duty), var(--gold));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .remaining-percent {
            margin-top: 6px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        /* Today status + countdown */
        .today-status {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .today-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 2px;
        }

        .today-state {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .today-state.state-duty { color: var(--duty); }
        .today-state.state-free { color: var(--free); }

        .countdown-chip {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dim);
            border: 1px dashed var(--panel-border);
            border-radius: 20px;
            padding: 6px 14px;
            white-space: nowrap;
        }

        /* Monthly stats */
        .stats-bar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .stat-chip {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
        }

        .stat-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .dot-duty { background: var(--duty); }
        .dot-free { background: var(--free); }

        .stat-chip strong {
            color: var(--text);
        }

        /* Navigation */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }

        .nav-button {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--panel-border);
            padding: 9px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }

        .nav-button:hover {
            border-color: var(--olive);
            color: var(--text);
            background: rgba(122,138,90,0.08);
        }

        .nav-button:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .nav-button:active {
            transform: scale(0.97);
        }

        .nav-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .nav-button:disabled:hover {
            border-color: var(--panel-border);
            background: transparent;
            color: var(--text-dim);
        }

        #current-month {
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text);
            text-transform: uppercase;
            text-align: center;
            flex: 1;
        }

        /* Calendar */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 6px;
        }

        .weekday-header {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            text-align: center;
            padding: 4px 2px 10px;
            color: var(--text-faint);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--panel-border);
        }

        .date-cell {
            position: relative;
            padding: 10px 4px 8px;
            text-align: center;
            border-radius: 4px;
            min-height: 62px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid transparent;
            transition: transform 0.12s ease;
        }

        .date-cell:active {
            transform: scale(0.95);
        }

        /* corner duty tab — signature element */
        .date-cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8px;
            width: 10px;
            height: 5px;
            border-radius: 0 0 2px 2px;
        }

        .date-cell .day-number {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1px;
            line-height: 1.1;
        }

        .date-cell .weekday {
            font-size: 0.68rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .green {
            background: var(--duty);
            color: #f2f7ee;
        }
        .green::before { background: #dff0d8; }

        .white {
            background: var(--free);
            color: #fbf5eb;
        }
        .white::before { background: #f4e4c8; }

        .past-green {
            background: var(--duty-dim);
            color: var(--text-dim);
        }
        .past-green::before { background: rgba(223,240,216,0.35); }

        .past-white {
            background: var(--free-dim);
            color: var(--text-dim);
        }
        .past-white::before { background: rgba(244,228,200,0.35); }

        .out-of-service {
            background: repeating-linear-gradient(
                135deg,
                rgba(255,255,255,0.025),
                rgba(255,255,255,0.025) 6px,
                transparent 6px,
                transparent 12px
            ), var(--panel);
            color: var(--text-faint);
            border: 1px solid var(--panel-border);
        }
        .out-of-service::before {
            display: none;
        }

        .date-cell.today {
            outline: 2px dashed var(--gold);
            outline-offset: 2px;
        }

        .date-cell.today .day-number::after {
            content: '';
        }

        .date-cell {
            cursor: pointer;
        }

        .note-dot {
            position: absolute;
            top: 5px;
            right: 6px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
        }

        /* Note modal */
        .note-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5,8,14,0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 50;
        }

        .note-modal-overlay.active {
            display: flex;
        }

        .note-modal {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 18px;
            width: 100%;
            max-width: 340px;
        }

        .note-modal-date {
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--gold);
            margin-bottom: 10px;
        }

        #note-input {
            width: 100%;
            min-height: 70px;
            resize: vertical;
            background: var(--bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        #note-input:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
        }

        .note-modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .note-modal-actions button {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 9px 12px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--text-dim);
        }

        #note-save {
            background: var(--duty);
            border-color: var(--duty);
            color: #f2f7ee;
            flex: 1;
        }

        #note-delete {
            border-color: var(--free-dim);
            color: var(--free);
        }

        /* Discharge celebration screen */
        .discharge-screen {
            position: relative;
            min-height: 65vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            padding: 40px 24px;
        }

        .discharge-icon {
            font-size: 2.4rem;
            z-index: 2;
            margin-bottom: 10px;
        }

        .discharge-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.02em;
            z-index: 2;
            margin-bottom: 8px;
        }

        .discharge-sub {
            font-size: 0.9rem;
            color: var(--text-dim);
            z-index: 2;
        }

        .fireworks-layer, .balloons-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: burst 2.6s ease-out infinite;
        }

        .fw1 { top: 22%; left: 20%; background: radial-gradient(circle, var(--gold), transparent 70%); animation-delay: 0s; }
        .fw2 { top: 30%; left: 75%; background: radial-gradient(circle, var(--duty), transparent 70%); animation-delay: 0.7s; }
        .fw3 { top: 55%; left: 12%; background: radial-gradient(circle, var(--free), transparent 70%); animation-delay: 1.4s; }
        .fw4 { top: 18%; left: 52%; background: radial-gradient(circle, var(--olive), transparent 70%); animation-delay: 0.35s; }
        .fw5 { top: 62%; left: 82%; background: radial-gradient(circle, var(--gold), transparent 70%); animation-delay: 1.9s; }

        @keyframes burst {
            0% { transform: scale(0); opacity: 0; }
            15% { opacity: 1; }
            60% { transform: scale(6); opacity: 0.5; }
            100% { transform: scale(9); opacity: 0; }
        }

        .balloon {
            position: absolute;
            bottom: -80px;
            width: 30px;
            height: 38px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: rise 7s linear infinite;
            opacity: 0.85;
        }

        .balloon::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            width: 1px;
            height: 22px;
            background: rgba(238,240,232,0.25);
        }

        .b1 { left: 10%; background: var(--gold); animation-delay: 0s; }
        .b2 { left: 28%; background: var(--duty); animation-delay: 1.2s; }
        .b3 { left: 46%; background: var(--free); animation-delay: 2.4s; }
        .b4 { left: 64%; background: var(--olive); animation-delay: 0.6s; }
        .b5 { left: 80%; background: var(--gold); animation-delay: 3.1s; }
        .b6 { left: 92%; background: var(--duty); animation-delay: 1.8s; }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.85; }
            100% { transform: translateY(-560px) translateX(24px); opacity: 0; }
        }

        /* Month transition — 3D flip */
        .calendar-wrap {
            position: relative;
            perspective: 1200px;
        }

        .calendar {
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform, opacity;
        }

        .calendar.flip-out-next {
            animation: flipOutNext 0.2s cubic-bezier(0.5, 0, 0.75, 0) forwards;
        }
        .calendar.flip-out-prev {
            animation: flipOutPrev 0.2s cubic-bezier(0.5, 0, 0.75, 0) forwards;
        }
        .calendar.flip-in-next {
            animation: flipInNext 0.28s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .calendar.flip-in-prev {
            animation: flipInPrev 0.28s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes flipOutNext {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(-95deg); opacity: 0.3; }
        }
        @keyframes flipOutPrev {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(95deg); opacity: 0.3; }
        }
        @keyframes flipInNext {
            0% { transform: rotateY(95deg); opacity: 0.3; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes flipInPrev {
            0% { transform: rotateY(-95deg); opacity: 0.3; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .calendar.flip-out-next, .calendar.flip-out-prev,
            .calendar.flip-in-next, .calendar.flip-in-prev {
                animation: none !important;
            }
        }

        /* Day note indicator + modal */
        .date-cell.has-note::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 0 2px rgba(0,0,0,0.25);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5,8,14,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 18px;
            width: 100%;
            max-width: 360px;
        }
        .modal-date {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 10px;
            letter-spacing: 0.03em;
        }
        .modal-box textarea {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            background: var(--bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            padding: 10px;
        }
        .modal-box textarea:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .modal-actions button {
            flex: 1;
            padding: 9px 10px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-actions button:hover {
            border-color: var(--olive);
            color: var(--text);
        }
        .modal-actions .save-btn {
            border-color: var(--duty);
            color: var(--duty);
        }
        .modal-actions .delete-btn {
            border-color: var(--free);
            color: var(--free);
        }

        /* Install prompt banner */
        .install-banner {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: 14px;
            max-width: 500px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-left: 3px solid var(--gold);
            border-radius: 6px;
            padding: 14px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            z-index: 100;
            animation: bannerRise 0.35s ease;
        }
        .install-banner.show {
            display: flex;
        }

        @keyframes bannerRise {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            flex-shrink: 0;
            object-fit: cover;
        }

        .install-text {
            flex: 1;
            min-width: 0;
        }

        .install-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.01em;
        }

        .install-sub {
            font-size: 0.76rem;
            color: var(--text-dim);
            margin-top: 2px;
            line-height: 1.35;
        }

        .install-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .install-btn {
            background: var(--duty);
            color: #f2f7ee;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .install-close {
            background: transparent;
            border: none;
            color: var(--text-faint);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            line-height: 1;
        }

        @media (max-width: 420px) {
            .install-sub { display: none; }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .calendar {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px;
            }
            .date-cell {
                min-height: 74px;
                padding: 12px 6px 10px;
            }
            .date-cell .day-number {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 400px) {
            .calendar {
                grid-template-columns: 1fr;
            }
            .weekday-header {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <span class="bar"></span>
            <h1>ჯარის განრიგი</h1>
            <span class="bar"></span>
        </header>

        <div id="app-content">
            <div class="remaining-card" id="remaining-card"></div>
            <div class="today-status" id="today-status"></div>
            <div class="message-container" id="message"></div>
            <div class="navigation">
                <button class="nav-button" id="prev-btn" onclick="prevMonth()">← წინა</button>
                <span id="current-month"></span>
                <button class="nav-button" id="next-btn" onclick="nextMonth()">შემდეგი →</button>
            </div>
            <div class="calendar-wrap" id="calendar-wrap">
                <div class="calendar" id="calendar"></div>
            </div>
            <div class="stats-bar" id="stats"></div>
        </div>

        <div class="discharge-screen" id="discharge-screen">
            <div class="fireworks-layer" aria-hidden="true">
                <span class="firework fw1"></span>
                <span class="firework fw2"></span>
                <span class="firework fw3"></span>
                <span class="firework fw4"></span>
                <span class="firework fw5"></span>
            </div>
            <div class="balloons-layer" aria-hidden="true">
                <span class="balloon b1"></span>
                <span class="balloon b2"></span>
                <span class="balloon b3"></span>
                <span class="balloon b4"></span>
                <span class="balloon b5"></span>
                <span class="balloon b6"></span>
            </div>
            <div class="discharge-icon">🎖️</div>
            <div class="discharge-title">თქვენ დასრულეთ სამხედრო სამსახური</div>
            <div class="discharge-sub">გილოცავთ! 🎉</div>
        </div>
    </div>

    <div class="modal-overlay" id="note-modal-overlay">
        <div class="modal-box">
            <div class="modal-date" id="note-modal-date"></div>
            <textarea id="note-textarea" placeholder="შენიშვნა ამ დღისთვის..."></textarea>
            <div class="modal-actions">
                <button onclick="closeNoteModal()">გაუქმება</button>
                <button class="delete-btn" onclick="deleteNoteHandler()">წაშლა</button>
                <button class="save-btn" onclick="saveNoteHandler()">შენახვა</button>
            </div>
        </div>
    </div>

    <div class="install-banner" id="install-banner">
        <img class="install-icon" src="icon-192.png" alt="">
        <div class="install-text">
            <div class="install-title" id="install-title">დააინსტალირეთ აპლიკაცია</div>
            <div class="install-sub" id="install-sub">დაამატეთ სახლის ეკრანზე, სამუშაოდ ინტერნეტის გარეშეც</div>
        </div>
        <div class="install-actions" id="install-actions">
            <button class="install-btn" id="install-btn">დაინსტალირება</button>
            <button class="install-close" id="install-close" aria-label="დახურვა">✕</button>
        </div>
    </div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }

    (function setupInstallPrompt() {
        const banner = document.getElementById('install-banner');
        const btn = document.getElementById('install-btn');
        const closeBtn = document.getElementById('install-close');
        const titleEl = document.getElementById('install-title');
        const subEl = document.getElementById('install-sub');

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;

        if (isStandalone) return;
        if (localStorage.getItem('install-banner-dismissed') === 'true') return;

        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

        function dismiss() {
            banner.classList.remove('show');
            localStorage.setItem('install-banner-dismissed', 'true');
        }

        closeBtn.addEventListener('click', dismiss);

        if (isIOS) {
            titleEl.textContent = 'დაამატეთ სახლის ეკრანზე';
            subEl.textContent = 'გახსენით Share მენიუ და აირჩიეთ „Add to Home Screen“';
            btn.textContent = 'გასაგებია';
            btn.addEventListener('click', dismiss);
            setTimeout(() => banner.classList.add('show'), 1200);
            return;
        }

        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            banner.classList.add('show');
        });

        btn.addEventListener('click', async () => {
            if (!deferredPrompt) { dismiss(); return; }
            banner.classList.remove('show');
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice.catch(() => null);
            deferredPrompt = null;
            if (choice && choice.outcome === 'dismissed') {
                localStorage.setItem('install-banner-dismissed', 'true');
            }
        });

        window.addEventListener('appinstalled', () => {
            banner.classList.remove('show');
            localStorage.setItem('install-banner-dismissed', 'true');
        });
    })();

    const months = ["იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი", "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"];
    const weekdays = ["კვი", "ორშ", "სამ", "ოთხ", "ხუთ", "პარ", "შაბ"];

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    const startDate = new Date("2026-07-24");
    const endDate = new Date("2027-01-04");
    const minYear = startDate.getFullYear();
    const minMonth = startDate.getMonth();
    const maxYear = endDate.getFullYear();
    const maxMonth = endDate.getMonth();

    if (currentYear < minYear || (currentYear === minYear && currentMonth < minMonth)) {
        currentYear = minYear;
        currentMonth = minMonth;
    } else if (currentYear > maxYear || (currentYear === maxYear && currentMonth > maxMonth)) {
        currentYear = maxYear;
        currentMonth = maxMonth;
    }

    function cycleDayOf(date) {
        const timeDiff = date - startDate;
        const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
        return ((days % 3) + 3) % 3;
    }

    function dateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function loadNotes() {
        try {
            return JSON.parse(localStorage.getItem('duty-notes') || '{}');
        } catch (e) {
            return {};
        }
    }

    function saveNotes(notes) {
        try {
            localStorage.setItem('duty-notes', JSON.stringify(notes));
        } catch (e) {}
    }

    let editingKey = null;

    function openNoteModal(date) {
        editingKey = dateKey(date);
        const notes = loadNotes();
        document.getElementById("note-modal-date").innerText =
            `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        document.getElementById("note-textarea").value = notes[editingKey] || '';
        document.getElementById("note-modal-overlay").classList.add("open");
        document.getElementById("note-textarea").focus();
    }

    function closeNoteModal() {
        document.getElementById("note-modal-overlay").classList.remove("open");
        editingKey = null;
    }

    function saveNoteHandler() {
        if (!editingKey) return;
        const text = document.getElementById("note-textarea").value.trim();
        const notes = loadNotes();
        if (text) {
            notes[editingKey] = text;
        } else {
            delete notes[editingKey];
        }
        saveNotes(notes);
        closeNoteModal();
        generateCalendar();
    }

    function deleteNoteHandler() {
        if (!editingKey) return;
        const notes = loadNotes();
        delete notes[editingKey];
        saveNotes(notes);
        closeNoteModal();
        generateCalendar();
    }

    function countDutyDaysBetween(from, to) {
        let count = 0;
        let d = new Date(from);
        while (d <= to) {
            if (cycleDayOf(d) === 0) count++;
            d.setDate(d.getDate() + 1);
        }
        return count;
    }

    function renderRemaining(startOfToday) {
        const remainingContainer = document.getElementById("remaining-card");
        const remaining = countDutyDaysBetween(startOfToday, endDate);

        const totalMs = endDate - startDate;
        const elapsedMs = Math.min(Math.max(startOfToday - startDate, 0), totalMs);
        const percent = totalMs > 0 ? Math.round((elapsedMs / totalMs) * 100) : 0;

        remainingContainer.innerHTML = `
            <div class="remaining-label">დარჩენილი განაწესის დღეები</div>
            <div class="remaining-number">${remaining}<span>4 იანვრამდე</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
            <div class="progress-label">გავლილია ${percent}%</div>
        `;
    }

    function renderTodayStatus(startOfToday) {
        const statusContainer = document.getElementById("today-status");

        if (startOfToday < startDate) {
            statusContainer.innerHTML = `
                <div>
                    <div class="today-label">დღეს</div>
                    <div class="today-state">სამსახური ჯერ არ დაწყებულა</div>
                </div>
            `;
            return;
        }

        if (startOfToday > endDate) {
            statusContainer.innerHTML = `
                <div>
                    <div class="today-label">დღეს</div>
                    <div class="today-state state-free">სამსახური დასრულებულია 🎉</div>
                </div>
            `;
            return;
        }

        const todayCycle = cycleDayOf(startOfToday);
        const isDuty = todayCycle === 0;

        let daysUntilChange = 0;
        let probe = new Date(startOfToday);
        while (true) {
            probe.setDate(probe.getDate() + 1);
            daysUntilChange++;
            const probeIsDuty = cycleDayOf(probe) === 0;
            if (probeIsDuty !== isDuty) break;
        }

        const chipText = daysUntilChange === 1
            ? "ხვალ იცვლება"
            : `იცვლება ${daysUntilChange} დღეში`;

        statusContainer.innerHTML = `
            <div>
                <div class="today-label">დღეს</div>
                <div class="today-state ${isDuty ? 'state-duty' : 'state-free'}">${isDuty ? 'სამსახურში ხარ' : 'თავისუფალი ხარ'}</div>
            </div>
            <div class="countdown-chip">${chipText}</div>
        `;
    }

    function renderStats(dutyCount, freeCount) {
        const statsContainer = document.getElementById("stats");
        statsContainer.innerHTML = `
            <div class="stat-chip"><span class="dot dot-duty"></span>დარჩენილი სამსახური: <strong>${dutyCount}</strong></div>
            <div class="stat-chip"><span class="dot dot-free"></span>დარჩენილი თავისუფალი: <strong>${freeCount}</strong></div>
        `;
    }


    function checkDischarge(startOfToday) {
        const appContent = document.getElementById("app-content");
        const dischargeScreen = document.getElementById("discharge-screen");

        if (startOfToday > endDate) {
            appContent.style.display = "none";
            dischargeScreen.style.display = "flex";
            return true;
        }

        appContent.style.display = "";
        dischargeScreen.style.display = "none";
        return false;
    }

    function generateCalendar() {
        const calendarContainer = document.getElementById("calendar");
        const messageContainer = document.getElementById("message");
        const currentMonthDisplay = document.getElementById("current-month");

        const today = new Date();
        const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        if (checkDischarge(startOfToday)) {
            return;
        }

        calendarContainer.innerHTML = '';

        if (window.innerWidth > 400) {
            weekdays.forEach(day => {
                const header = document.createElement("div");
                header.classList.add("weekday-header");
                header.innerText = day;
                calendarContainer.appendChild(header);
            });
        }

        const monthStart = new Date(currentYear, currentMonth, 1);
        const monthEnd = new Date(currentYear, currentMonth + 1, 0);
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        renderRemaining(startOfToday);
        renderTodayStatus(startOfToday);
        let dutyCount = 0;
        let freeCount = 0;

        currentMonthDisplay.innerText = `${months[currentMonth]} ${currentYear}`;

        // Empty cells
        for (let i = 0; i < monthStart.getDay(); i++) {
            calendarContainer.appendChild(document.createElement("div"));
        }

        const notes = loadNotes();
        let currentDate = new Date(monthStart);
        while (currentDate <= monthEnd) {
            const dateCell = document.createElement("div");
            dateCell.classList.add("date-cell");

            const inService = currentDate >= startDate && currentDate <= endDate;
            let cycleDay = null;

            if (inService) {
                cycleDay = cycleDayOf(currentDate);
                if (cycleDay === 0) {
                    dateCell.classList.add("green");
                    if (currentDate >= startOfToday) dutyCount++;
                } else {
                    dateCell.classList.add("white");
                    if (currentDate >= startOfToday) freeCount++;
                }
            } else {
                dateCell.classList.add("out-of-service");
            }

            const dayNum = currentDate.getDate();
            const weekday = weekdays[currentDate.getDay()];

            dateCell.innerHTML = `
                <div class="day-number">${dayNum}</div>
                <div class="weekday">${weekday}</div>
            `;

            // Past days styling (fixed: compare against start of today, not the current moment)
            if (inService && currentDate < startOfToday) {
                if (dateCell.classList.contains("green")) {
                    dateCell.classList.remove("green");
                    dateCell.classList.add("past-green");
                } else {
                    dateCell.classList.remove("white");
                    dateCell.classList.add("past-white");
                }
            }

            // Mark today
            if (currentDate.getTime() === startOfToday.getTime()) {
                dateCell.classList.add("today");
            }

            // Note indicator + click-to-edit
            const cellDate = new Date(currentDate);
            const key = dateKey(cellDate);
            if (notes[key]) {
                dateCell.classList.add("has-note");
                dateCell.title = notes[key];
            }
            dateCell.addEventListener("click", () => openNoteModal(cellDate));

            // Tomorrow message
            if (currentDate.getFullYear() === tomorrow.getFullYear() &&
                currentDate.getMonth() === tomorrow.getMonth() &&
                currentDate.getDate() === tomorrow.getDate()) {

                const tomorrowInService = tomorrow >= startDate && tomorrow <= endDate;
                if (tomorrowInService) {
                    messageContainer.innerHTML = cycleDay === 0
                        ? "ხვალ სამხედრო სამსახურში ხარ 😱"
                        : "ხვალ სამოქალაქოზე ხარ😍🥳";
                } else if (tomorrow > endDate) {
                    messageContainer.innerHTML = "ხვალ სამსახური დასრულებულია 🎉";
                } else {
                    messageContainer.innerHTML = "";
                }
            }

            calendarContainer.appendChild(dateCell);
            currentDate.setDate(currentDate.getDate() + 1);
        }

        renderStats(dutyCount, freeCount);

        document.getElementById("prev-btn").disabled = (currentYear === minYear && currentMonth === minMonth);
        document.getElementById("next-btn").disabled = (currentYear === maxYear && currentMonth === maxMonth);
    }

    function animatedMonthChange(direction) {
        const cal = document.getElementById("calendar");
        const outClass = direction === "next" ? "flip-out-next" : "flip-out-prev";
        const inClass = direction === "next" ? "flip-in-next" : "flip-in-prev";

        cal.classList.add(outClass);

        setTimeout(() => {
            generateCalendar();
            cal.classList.remove(outClass);
            cal.classList.add(inClass);
            setTimeout(() => cal.classList.remove(inClass), 300);
        }, 200);
    }

    function prevMonth() {
        if (currentYear === minYear && currentMonth === minMonth) return;
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        animatedMonthChange("prev");
    }

    function nextMonth() {
        if (currentYear === maxYear && currentMonth === maxMonth) return;
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        animatedMonthChange("next");
    }

    generateCalendar();
    window.addEventListener('resize', generateCalendar);
</script>
</body>
</html>
